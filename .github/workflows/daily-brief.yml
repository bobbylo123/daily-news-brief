name: Daily News Brief (manual fallback)

# Modal.com is the primary runtime — see modal_app.py. It runs the brief at
# 23:00 UTC daily with built-in retry. This workflow exists ONLY as a
# manual-trigger fallback for emergencies (Modal outage, etc.). The
# scheduled cron is intentionally NOT enabled here, to prevent double-send.
#
# To trigger manually: Actions tab → "Daily News Brief (manual fallback)"
# → Run workflow → main.
on:
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python daily_brief.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: blhcobby322@gmail.com
